version: 2
updates:
  # Backend NuGet packages
  - package-ecosystem: "nuget"
    directory: "/backend/AppSecLab.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
