version: 2
updates:
  # Backend NuGet packages
  - package-ecosystem: "nuget"
    directory: "/backend/AppSecLab.Api"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions — keeps the SHA-pinned actions in security.yml current.
  # Dependabot opens a PR bumping the SHA (with the tag comment updated
  # too) whenever a pinned action has a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
