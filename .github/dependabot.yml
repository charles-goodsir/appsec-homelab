version: 2
updates:
  # Backend NuGet packages
  - package-ecosystem: "nuget"
    directory: "/backend/AppSecLab.Api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # GitHub Actions — keeps the SHA-pinned actions in security.yml current.
  # Dependabot opens a PR bumping the SHA (with the tag comment updated
  # too) whenever a pinned action has a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
