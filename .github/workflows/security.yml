name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default: read-only. Jobs elevate individually only where they need to.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Secret scanning — catches committed credentials, API keys, tokens.
  # ---------------------------------------------------------------------
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # SAST — static analysis of source for OWASP-class vulns.
  # ---------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config=p/owasp-top-ten \
            --config=p/csharp \
            --config=p/typescript \
            --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to code scanning
        if: always() # upload findings even if semgrep ci exits non-zero on findings
        uses: github/codeql-action/upload-sarif@35632bdbd38dba649ce80e15482f7a399a32d400 # v3.27.9
        with:
          sarif_file: semgrep.sarif

  # ---------------------------------------------------------------------
  # Build — compiles backend and frontend. Fails fast on broken code
  # before anything downstream (dependency scan, tests) bothers running.
  # ---------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore & build backend
        working-directory: backend/AppSecLab.Api
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------
  # Dependency scan — known CVEs in NuGet and npm packages.
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Check for vulnerable NuGet packages
        working-directory: backend/AppSecLab.Api
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee nuget-vuln.txt
          if grep -qi "has the following vulnerable packages" nuget-vuln.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check for vulnerable npm packages
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # Test — no test project exists yet in this repo. Stubbed so the job
  # graph and README badge reflect the intended pipeline shape; swap the
  # placeholder step for `dotnet test` / `npm test` once tests exist.
  # ---------------------------------------------------------------------
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: No tests yet
        run: echo "::notice::No automated tests in this repo yet — placeholder job."
