name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default: read-only. Jobs elevate individually only where they need to.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Secret scanning — catches committed credentials, API keys, tokens.
  # ---------------------------------------------------------------------
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # SAST — static analysis of source for OWASP-class vulns.
  # ---------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config=p/owasp-top-ten \
            --config=p/csharp \
            --config=p/typescript \
            --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to code scanning
        if: always() # upload findings even if semgrep ci exits non-zero on findings
        uses: github/codeql-action/upload-sarif@35632bdbd38dba649ce80e15482f7a399a32d400 # v3.27.9
        with:
          sarif_file: semgrep.sarif

  # ---------------------------------------------------------------------
  # Build — compiles backend and frontend. Fails fast on broken code
  # before anything downstream (dependency scan, tests) bothers running.
  # ---------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore & build backend
        working-directory: backend/AppSecLab.Api
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------
  # Dependency scan — known CVEs in NuGet and npm packages.
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Check for vulnerable NuGet packages
        working-directory: backend/AppSecLab.Api
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee nuget-vuln.txt
          if grep -qi "has the following vulnerable packages" nuget-vuln.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check for vulnerable npm packages
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # Test — no test project exists yet in this repo. Stubbed so the job
  # graph and README badge reflect the intended pipeline shape; swap the
  # placeholder step for `dotnet test` / `npm test` once tests exist.
  # ---------------------------------------------------------------------
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: No tests yet
        run: echo "::notice::No automated tests in this repo yet — placeholder job."

  # ---------------------------------------------------------------------
  # Container scan — builds both images and scans the filesystem inside
  # each (OS packages + app deps in the final layer, not just source).
  # Catches things SAST/dependency-scan never see, e.g. a vulnerable
  # base-image package. Non-blocking (severity table posted, no fail)
  # until you've triaged a baseline run and decided what "clean" means
  # for this repo — flip `exit-code` to `1` once you have.
  # ---------------------------------------------------------------------
  container-scan:
    name: Container Scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build -t appseclab-backend:scan backend/AppSecLab.Api

      - name: Build frontend image
        run: docker build -t appseclab-frontend:scan frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: appseclab-backend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # start non-blocking; tighten to "1" after triage

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: appseclab-frontend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ---------------------------------------------------------------------
  # Deploy — staging then prod, main branch only. Prod is a separate job
  # tied to the `production` GitHub Environment, which you configure with
  # a required reviewer in Settings → Environments. That pause is the
  # deployment gate: the run stops here until a human approves it.
  # ---------------------------------------------------------------------
  deploy-staging:
    name: Deploy (staging)
    needs: [secrets, sast, build, dependency-scan, container-scan, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Deploy to mini PC via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/appsec-homelab
            git pull
            docker compose up -d --build

      # DAST target is LAN-only (never internet-exposed, by design — see
      # DEPLOY.md), so a GitHub-hosted runner can't reach it directly.
      # Cheapest fix without a self-hosted runner: run ZAP *on* the mini
      # PC via the same SSH connection, against the app's own LAN address.
      - name: DAST — ZAP baseline via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/appsec-homelab/dast
            docker run --rm -v ~/appsec-homelab/dast:/zap/wrk/:rw \
              ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t http://${{ secrets.SSH_HOST }}:8080 \
              -r zap-baseline-report.html || true
            # `|| true`: baseline exits non-zero on WARN-level findings too,
            # which would fail the job on noise. Findings still land in the
            # HTML report either way — read it, don't just watch the exit code.

      - name: Pull ZAP report back from the mini PC
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "appsec-homelab/dast/zap-baseline-report.html"
          target: "."
          strip_components: 2

      - name: Upload ZAP report as workflow artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html
          retention-days: 14

  deploy-prod:
    name: Deploy (production)
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # protection rule (required reviewer) set in repo Settings
    permissions:
      contents: read
    steps:
      - name: Deploy to production
        run: echo "::notice::Wire up the real production deploy once a prod target exists."
