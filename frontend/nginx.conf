server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (remediation for the ZAP baseline findings) ---
    # Don't leak the nginx version in the Server header or error pages.
    server_tokens off;

    # Sent on every response, including proxied /api/ and error pages.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Basic CSP. The Vite production build ships external JS/CSS with no inline
    # <script>, so 'self' is enough for script-src - which also blocks inline
    # event handlers like the `onerror=` in the seeded reflected-XSS payload.
    # 'unsafe-inline' is kept for style-src only (pragmatic for a starter policy).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Cross-origin isolation / feature policy (ZAP round 2 findings).
    # COOP + CORP are safe here: the SPA and its /api/ proxy are all same-origin
    # and load no cross-origin subresources.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # COEP require-corp breaks any cross-origin load lacking CORP/CORS headers.
    # Enabled because everything here is same-origin; revisit if external assets
    # (fonts, images, analytics) are ever added.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # SPA: serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend container.
    # No trailing slash on proxy_pass -> the /api/ prefix is preserved,
    # so /api/auth/login and /api/products/search reach the backend unchanged.
    #
    # nginx only inherits the server-level add_header directives into a location
    # that defines none of its own, so this block deliberately adds no headers.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
