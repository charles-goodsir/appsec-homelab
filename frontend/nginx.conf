server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend container.
    # No trailing slash on proxy_pass -> the /api/ prefix is preserved,
    # so /api/auth/login and /api/products/search reach the backend unchanged.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
